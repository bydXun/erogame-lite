<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="bydXun Lite 管理后台">
  <title>管理后台 · bydXun Lite</title>
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/editor.css">
  <link rel="stylesheet" href="assets/fonts.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
  <script src="assets/posts.js"></script>
  <script src="assets/admin.js" defer></script>
</head>
<body>
  <header class="editor-header">
    <div class="editor-header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>bydXun Lite 管理后台</span>
      </a>
      <div class="editor-header-actions">
        <a class="button secondary" href="index.html">查看网站</a>
        <button class="button secondary" type="button" data-new-post>新建文章</button>
        <button class="button secondary" type="button" data-save-draft>保存草稿</button>
        <button class="button" type="button" data-publish-post>发布文章</button>
        <button class="button secondary" type="button" data-logout>退出</button>
      </div>
    </div>
  </header>

  <main class="editor-page">
    <aside class="editor-sidebar">
      <div class="sidebar-head">
        <strong>云端文章</strong>
        <div class="sidebar-actions">
          <button class="button" type="button" data-new-post>新建</button>
          <button class="button secondary" type="button" data-delete-post>删除</button>
        </div>
        <input class="editor-search" type="search" data-post-search placeholder="搜索标题、分类或标签">
      </div>
      <div class="post-list" data-post-list></div>
    </aside>

    <section class="editor-main">
      <div class="editor-panel site-copy-panel">
        <div class="editor-panel-head">
          <div>
            <h2 class="editor-panel-title">网站版块文案</h2>
            <div class="editor-status">
              <span data-site-copy-status>正在读取网站文案…</span>
            </div>
          </div>
          <button class="button" type="button" data-save-site-copy>保存文案</button>
        </div>

        <div class="form-grid">
          <div class="form-field full">
            <label for="site-hero-title">首屏主标题</label>
            <textarea id="site-hero-title" data-site-copy-field="hero_title"></textarea>
            <span class="field-hint">换行会保留，建议保持两行以内。</span>
          </div>

          <div class="form-field">
            <label for="site-hero-kicker">首屏小标题</label>
            <input id="site-hero-kicker" data-site-copy-field="hero_kicker">
          </div>

          <div class="form-field full">
            <label for="site-hero-description">首屏说明</label>
            <textarea id="site-hero-description" data-site-copy-field="hero_description"></textarea>
          </div>

          <div class="form-field">
            <label for="site-playing-title">“最近游玩”标题</label>
            <input id="site-playing-title" data-site-copy-field="playing_title">
          </div>

          <div class="form-field">
            <label for="site-playing-link">“最近游玩”入口文字</label>
            <input id="site-playing-link" data-site-copy-field="playing_link_label">
          </div>

          <div class="form-field">
            <label for="site-recent-title">“最近记录”标题</label>
            <input id="site-recent-title" data-site-copy-field="recent_title">
          </div>

          <div class="form-field">
            <label for="site-recent-link">“最近记录”入口文字</label>
            <input id="site-recent-link" data-site-copy-field="recent_link_label">
          </div>

          <div class="form-field">
            <label for="site-guides-title">“攻略与教程”标题</label>
            <input id="site-guides-title" data-site-copy-field="guides_title">
          </div>

          <div class="form-field">
            <label for="site-guides-link">“攻略与教程”入口文字</label>
            <input id="site-guides-link" data-site-copy-field="guides_link_label">
          </div>

          <div class="form-field">
            <label for="site-about-title">“关于这个站点”标题</label>
            <input id="site-about-title" data-site-copy-field="about_title">
          </div>

          <div class="form-field">
            <label for="site-about-link">“关于这个站点”入口文字</label>
            <input id="site-about-link" data-site-copy-field="about_link_label">
          </div>

          <div class="form-field full">
            <label for="site-about-text">“关于这个站点”说明</label>
            <textarea id="site-about-text" data-site-copy-field="about_text"></textarea>
          </div>

          <div class="form-field">
            <label for="site-hero-primary">首屏主按钮文字</label>
            <input id="site-hero-primary" data-site-copy-field="hero_primary_label">
          </div>

          <div class="form-field">
            <label for="site-hero-secondary">首屏次按钮文字</label>
            <input id="site-hero-secondary" data-site-copy-field="hero_secondary_label">
          </div>

          <div class="form-field full">
            <label for="site-archive-title">归档页标题</label>
            <input id="site-archive-title" data-site-copy-field="archive_page_title">
          </div>

          <div class="form-field full">
            <label for="site-archive-description">归档页说明</label>
            <textarea id="site-archive-description" data-site-copy-field="archive_page_description"></textarea>
          </div>

          <div class="form-field full">
            <label for="site-tags-title">标签页标题</label>
            <input id="site-tags-title" data-site-copy-field="tags_page_title">
          </div>

          <div class="form-field full">
            <label for="site-tags-description">标签页说明</label>
            <textarea id="site-tags-description" data-site-copy-field="tags_page_description"></textarea>
          </div>

          <div class="form-field full">
            <label for="site-search-title">搜索页标题</label>
            <input id="site-search-title" data-site-copy-field="search_page_title">
          </div>

          <div class="form-field full">
            <label for="site-search-description">搜索页说明</label>
            <textarea id="site-search-description" data-site-copy-field="search_page_description"></textarea>
          </div>

          <div class="form-field full">
            <label for="site-about-page-title">关于页标题</label>
            <input id="site-about-page-title" data-site-copy-field="about_page_title">
          </div>

          <div class="form-field full">
            <label for="site-about-page-description">关于页说明</label>
            <textarea id="site-about-page-description" data-site-copy-field="about_page_description"></textarea>
          </div>

          <div class="form-field">
            <label for="site-about-why-title">关于页第一段标题</label>
            <input id="site-about-why-title" data-site-copy-field="about_why_title">
          </div>

          <div class="form-field full">
            <label for="site-about-why-text">关于页第一段正文</label>
            <textarea id="site-about-why-text" data-site-copy-field="about_why_text"></textarea>
          </div>

          <div class="form-field">
            <label for="site-about-write-title">关于页第二段标题</label>
            <input id="site-about-write-title" data-site-copy-field="about_write_title">
          </div>

          <div class="form-field full">
            <label for="site-about-write-text">关于页第二段正文</label>
            <textarea id="site-about-write-text" data-site-copy-field="about_write_text"></textarea>
          </div>

          <div class="form-field full">
            <label for="site-about-principles-title">关于页原则标题</label>
            <input id="site-about-principles-title" data-site-copy-field="about_principles_title">
          </div>

          <div class="form-field full">
            <label for="site-about-principles">关于页原则列表</label>
            <textarea id="site-about-principles" data-site-copy-field="about_principles"></textarea>
            <span class="field-hint">每行一条。</span>
          </div>

          <div class="form-field">
            <label for="site-about-links-title">关于页入口标题</label>
            <input id="site-about-links-title" data-site-copy-field="about_links_title">
          </div>

          <div class="form-field">
            <label for="site-about-link-archive">“文章归档”文字</label>
            <input id="site-about-link-archive" data-site-copy-field="about_link_archive_label">
          </div>

          <div class="form-field">
            <label for="site-about-link-tags">“全部标签”文字</label>
            <input id="site-about-link-tags" data-site-copy-field="about_link_tags_label">
          </div>

          <div class="form-field">
            <label for="site-about-link-search">“搜索文章”文字</label>
            <input id="site-about-link-search" data-site-copy-field="about_link_search_label">
          </div>

          <div class="form-field">
            <label for="site-about-link-subscribe">“订阅更新”文字</label>
            <input id="site-about-link-subscribe" data-site-copy-field="about_link_subscribe_label">
          </div>

          <div class="form-field full">
            <label for="site-footer-text">页脚文案</label>
            <textarea id="site-footer-text" data-site-copy-field="footer_text"></textarea>
          </div>
        </div>
      </div>

      <div class="editor-panel">
        <div class="editor-panel-head">
          <div>
            <h1 class="editor-panel-title">编辑文章</h1>
            <div class="editor-status">
              <span data-cloud-status>正在读取云端文章…</span>
              <span class="dirty" data-dirty-status hidden>有未保存修改</span>
            </div>
          </div>
          <div class="form-row-inline">
            <button class="button secondary" type="button" data-move-up>上移</button>
            <button class="button secondary" type="button" data-move-down>下移</button>
            <button class="button secondary" type="button" data-save-draft>保存草稿</button>
            <button class="button" type="button" data-publish-post>发布</button>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-field full">
            <label for="admin-title">标题</label>
            <textarea id="admin-title" data-field="title" placeholder="文章标题"></textarea>
          </div>

          <div class="form-field">
            <label for="admin-slug">文章路径</label>
            <div class="form-row-inline">
              <input id="admin-slug" data-field="slug" placeholder="post-20261001">
              <button class="button secondary" type="button" data-generate-slug>自动生成</button>
            </div>
          </div>

          <div class="form-field">
            <label for="admin-date">发布日期</label>
            <input id="admin-date" type="date" data-field="date">
          </div>

          <div class="form-field">
            <label for="admin-type">文章类型</label>
            <select id="admin-type" data-field="type">
              <option value="game">游戏感想</option>
              <option value="tutorial">教程</option>
              <option value="essay">杂谈</option>
            </select>
          </div>

          <div class="form-field">
            <label for="admin-category">显示分类</label>
            <input id="admin-category" data-field="category">
          </div>

          <div class="form-field full">
            <label for="admin-summary">文章摘要</label>
            <textarea id="admin-summary" data-field="summary"></textarea>
          </div>

          <div class="form-field full">
            <label for="admin-tags">标签</label>
            <input id="admin-tags" data-field="tags" placeholder="用英文逗号分隔">
          </div>

          <div class="form-field full">
            <label for="admin-cover">封面图片</label>
            <div class="form-row-inline">
              <input id="admin-cover" data-field="cover" placeholder="/media/... 或图片地址">
              <label class="button secondary file-button">
                上传封面
                <input type="file" accept="image/*" data-cover-image-input hidden>
              </label>
            </div>
          </div>

          <div class="form-field full">
            <div class="cover-preview" data-cover-preview></div>
          </div>

          <div class="form-field full">
            <label class="checkbox-line">
              <input type="checkbox" data-field="featured">
              首页推荐
            </label>
          </div>
        </div>
      </div>

      <div class="editor-panel">
        <div class="editor-panel-head">
          <h2 class="editor-panel-title">正文</h2>
          <label class="button secondary file-button">
            插入图片
            <input type="file" accept="image/*" data-content-image-input hidden>
          </label>
        </div>

        <div class="rich-editor">
          <div class="editor-toolbar" role="toolbar" aria-label="正文格式">
            <select class="toolbar-select" data-font-size-select aria-label="字号">
              <option value="">字号</option>
              <option value="14">14</option>
              <option value="16">16</option>
              <option value="18">18</option>
              <option value="20">20</option>
              <option value="24">24</option>
              <option value="28">28</option>
            </select>
            <button class="toolbar-button" type="button" data-command="formatBlock" data-value="h2">大标题</button>
            <button class="toolbar-button" type="button" data-command="formatBlock" data-value="h3">小标题</button>
            <button class="toolbar-button" type="button" data-command="formatBlock" data-value="p">正文</button>
            <button class="toolbar-button" type="button" data-command="bold"><i data-lucide="bold"></i>粗体</button>
            <button class="toolbar-button" type="button" data-command="italic"><i data-lucide="italic"></i>斜体</button>
            <button class="toolbar-button" type="button" data-command="insertUnorderedList"><i data-lucide="list"></i>列表</button>
            <button class="toolbar-button" type="button" data-command="insertOrderedList"><i data-lucide="list-ordered"></i>编号</button>
            <button class="toolbar-button" type="button" data-command="formatBlock" data-value="blockquote"><i data-lucide="quote"></i>引用</button>
            <button class="toolbar-button" type="button" data-insert-link><i data-lucide="link"></i>链接</button>
            <label class="toolbar-button file-button">
              <i data-lucide="image"></i>图片
              <input type="file" accept="image/*" data-content-image-input hidden>
            </label>
            <button class="toolbar-button" type="button" data-insert-code><i data-lucide="code-2"></i>代码</button>
            <button class="toolbar-button" type="button" data-insert-callout><i data-lucide="message-square-warning"></i>提示框</button>
            <button class="toolbar-button" type="button" data-insert-keypoints"><i data-lucide="badge-check"></i>重点框</button>
            <button class="toolbar-button" type="button" data-command="removeFormat">清除格式</button>
          </div>
          <div
            class="rich-content"
            contenteditable="true"
            spellcheck="true"
            data-rich-content
            data-placeholder="开始写正文…"
          ></div>
        </div>
      </div>

      <div class="preview-panel">
        <div class="preview-head">
          <h2 class="preview-title">实时预览</h2>
          <span class="editor-status" data-preview-status>草稿预览</span>
        </div>
        <div class="preview-body" data-preview-body></div>
      </div>
    </section>
  </main>

  <div class="modal open" id="admin-auth" role="dialog" aria-modal="true" aria-labelledby="admin-auth-title">
    <div class="modal-card">
      <div class="modal-head">
        <h2 class="modal-title" id="admin-auth-title" data-auth-title>管理员登录</h2>
      </div>
      <p class="modal-copy" data-auth-copy>使用站点管理员账号登录。</p>
      <form class="modal-form admin-auth-form" data-auth-form>
        <label class="form-field full">
          <span>用户名</span>
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label class="form-field full">
          <span>密码</span>
          <input type="password" name="password" autocomplete="current-password" minlength="8" required>
        </label>
        <label class="form-field full" data-setup-token-field hidden>
          <span>初始化密钥</span>
          <input type="password" name="setupToken" autocomplete="off">
        </label>
        <button class="button" type="submit" data-auth-submit>登录</button>
      </form>
      <p class="modal-copy" data-auth-error></p>
    </div>
  </div>

  <div class="toast" data-admin-toast></div>
</body>
</html>
